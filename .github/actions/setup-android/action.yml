name: Set up Aqaqeer Android tooling
description: Shared pinned JDK, default-branch Gradle cache writes and SDK setup after checkout
inputs:
  setup-gradle:
    description: Configure Gradle and restore its cache; false only for signing-only jobs that never invoke Gradle
    default: 'true'
  instrumentation-cache:
    description: Prefer dependency snapshots produced by Android test compilation
    default: 'false'
  diagnostics-directory:
    description: Directory under ci-output for SDK setup diagnostics
    required: true
runs:
  using: composite
  steps:
    - name: Read Android configuration and verify wrapper mode
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/scripts/android_config.py --github-env
        test "$(git ls-files -s -- gradlew | cut -d ' ' -f 1)" = 100755
        test -x gradlew

    - name: Set up JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle and validate wrapper
      if: ${{ inputs.setup-gradle == 'true' }}
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: external
        validate-wrappers: true

    - name: Configure hosted JVM heaps
      if: ${{ inputs.setup-gradle == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$gradle_home"
        printf '\n%s\n' \
          'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
          'kotlin.daemon.jvmargs=-Xmx3g' \
          'aqaqeer.testMaxHeap=2g' >> "$gradle_home/gradle.properties"

    - name: Restore the pinned Gradle distribution
      id: restore-wrapper
      if: ${{ inputs.setup-gradle == 'true' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.gradle/wrapper/dists
        key: aqaqeer-gradle-wrapper-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

    - name: Provision the Gradle distribution on a default-branch cache miss
      id: provision-wrapper
      if: ${{ inputs.setup-gradle == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.restore-wrapper.outputs.cache-hit != 'true' }}
      shell: bash
      run: ./gradlew --version

    - name: Save the provisioned Gradle distribution
      if: ${{ inputs.setup-gradle == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.provision-wrapper.outcome == 'success' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.gradle/wrapper/dists
        key: aqaqeer-gradle-wrapper-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

    - name: Restore and retain downloaded Gradle dependencies
      if: ${{ inputs.setup-gradle == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      env:
        TAR_OPTIONS: '--exclude=*.lock --exclude=gc.properties'
      with:
        path: |
          ~/.gradle/caches/modules-2/files-2.1
          ~/.gradle/caches/modules-2/metadata-2.*
        key: aqaqeer-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.instrumentation-cache == 'true' && 'instrumentation-' || '' }}${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
        # The historical instrumentation hit seeds the new prefix while the entry is still available.
        restore-keys: |
          ${{ inputs.instrumentation-cache == 'true' && format('aqaqeer-dependencies-v2-{0}-{1}-instrumentation-', runner.os, runner.arch) || '' }}
          ${{ inputs.instrumentation-cache == 'true' && format('aqaqeer-dependencies-v2-{0}-{1}-45591154331-1-verify-2', runner.os, runner.arch) || '' }}
          aqaqeer-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore downloaded Gradle dependencies on other branches
      if: ${{ inputs.setup-gradle == 'true' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ~/.gradle/caches/modules-2/files-2.1
          ~/.gradle/caches/modules-2/metadata-2.*
        key: aqaqeer-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.instrumentation-cache == 'true' && 'instrumentation-' || '' }}${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
        restore-keys: |
          ${{ inputs.instrumentation-cache == 'true' && format('aqaqeer-dependencies-v2-{0}-{1}-instrumentation-', runner.os, runner.arch) || '' }}
          ${{ inputs.instrumentation-cache == 'true' && format('aqaqeer-dependencies-v2-{0}-{1}-45591154331-1-verify-2', runner.os, runner.arch) || '' }}
          aqaqeer-dependencies-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Install missing Android SDK packages
      shell: bash
      env:
        CI_SETUP_DIAGNOSTICS: ${{ inputs.diagnostics-directory }}
      run: |
        set -euo pipefail
        [[ "$CI_SETUP_DIAGNOSTICS" =~ ^ci-output/[a-zA-Z0-9_-]+$ ]]
        mkdir -p "$CI_SETUP_DIAGNOSTICS"
        platform_dir="$ANDROID_HOME/platforms/$CI_ANDROID_PLATFORM"
        tools_dir="$ANDROID_HOME/build-tools/$CI_ANDROID_BUILD_TOOLS"
        platform_package="platforms;$CI_ANDROID_PLATFORM"
        tools_package="build-tools;$CI_ANDROID_BUILD_TOOLS"
        missing=()
        if ! [[ -s "$platform_dir/android.jar" && -r "$platform_dir/package.xml" ]] ||
           ! grep -Fq "path=\"$platform_package\"" "$platform_dir/package.xml"; then
          missing+=("$platform_package")
        fi
        if ! [[ -x "$tools_dir/aapt2" && -x "$tools_dir/d8" && -x "$tools_dir/apksigner" &&
                -x "$tools_dir/zipalign" && -r "$tools_dir/package.xml" ]] ||
           ! grep -Fq "path=\"$tools_package\"" "$tools_dir/package.xml"; then
          missing+=("$tools_package")
        fi
        {
          if (( ${#missing[@]} )); then
            printf 'Installing missing SDK packages: %s\n' "${missing[*]}"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${missing[@]}"
          else
            printf 'Using installed SDK packages: %s, %s\n' "$platform_package" "$tools_package"
          fi
        } 2>&1 | tee "$CI_SETUP_DIAGNOSTICS/sdk-setup.log"
