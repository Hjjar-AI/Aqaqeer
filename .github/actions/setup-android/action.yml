name: Set up Aqaqeer Android tooling
description: Shared pinned JDK, default-branch Gradle cache writes and SDK setup after checkout
inputs:
  setup-gradle:
    description: Configure Gradle and restore its cache; false only for signing-only jobs that never invoke Gradle
    default: 'true'
  diagnostics-directory:
    description: Directory under ci-output for SDK setup diagnostics
    required: true
runs:
  using: composite
  steps:
    - name: Read Android configuration and verify wrapper mode
      shell: bash
      run: |
        set -euo pipefail
        python3 .github/scripts/android_config.py --github-env
        test "$(git ls-files -s -- gradlew | cut -d ' ' -f 1)" = 100755
        test -x gradlew

    - name: Set up JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Gradle cache
      if: ${{ inputs.setup-gradle == 'true' }}
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-provider: basic
        cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

    # The basic provider's exact-key snapshot cannot grow. Restore a newer
    # dependency-only snapshot after it, then save additions on successful jobs.
    - name: Restore and retain downloaded Gradle dependencies
      if: ${{ inputs.setup-gradle == 'true' && github.ref_name == github.event.repository.default_branch }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.gradle/caches/modules-2
        key: aqaqeer-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
        restore-keys: aqaqeer-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore downloaded Gradle dependencies on other branches
      if: ${{ inputs.setup-gradle == 'true' && github.ref_name != github.event.repository.default_branch }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.gradle/caches/modules-2
        key: aqaqeer-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}
        restore-keys: aqaqeer-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Android SDK packages
      shell: bash
      env:
        CI_SETUP_DIAGNOSTICS: ${{ inputs.diagnostics-directory }}
      run: |
        set -euo pipefail
        [[ "$CI_SETUP_DIAGNOSTICS" =~ ^ci-output/[a-zA-Z0-9_-]+$ ]]
        mkdir -p "$CI_SETUP_DIAGNOSTICS"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;$CI_ANDROID_PLATFORM" "build-tools;$CI_ANDROID_BUILD_TOOLS" \
          2>&1 | tee "$CI_SETUP_DIAGNOSTICS/sdk-setup.log"
