name: 05 - Checks - Security analysis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
            queries: security-extended
          - language: python
            build-mode: none
            queries: security-extended
          - language: actions
            build-mode: none
            queries: ''
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare diagnostics
        run: mkdir -p ci-output/codeql

      - name: Set up Android tooling
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: ./.github/actions/setup-android
        with:
          diagnostics-directory: ci-output/codeql

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: ${{ matrix.queries }}

      - name: Compile production sources for CodeQL extraction
        if: ${{ matrix.language == 'java-kotlin' }}
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          # Force actual compilation for extraction instead of cached outputs.
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks \
            --console=plain :app:compileStandardDebugKotlin :app:compileDemoDebugKotlin \
            2>&1 | tee ci-output/codeql/gradle-compile.log

      - name: Analyze and upload security results
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: ci-output/codeql/sarif

      - name: Write security analysis summary
        if: ${{ !cancelled() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_COMMAND_OUTCOME: ${{ steps.analyze.outcome }}
        run: python3 .github/scripts/ci-summary.py codeql

      - name: Retain security diagnostics and SARIF
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-diagnostics-${{ matrix.language }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ci-output/codeql/
          if-no-files-found: error
          retention-days: 1
