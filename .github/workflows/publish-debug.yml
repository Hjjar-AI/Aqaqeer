name: 10 - Publish - Debug APKs to GitHub Releases

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Build standard, demo with local sample data, or both independently
        type: choice
        required: true
        default: standard
        options:
          - standard
          - demo
          - both
      publication:
        description: Publish a regular release, publish a prerelease, or save a draft
        type: choice
        required: true
        default: prerelease
        options:
          - release
          - prerelease
          - draft

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reserve:
    if: ${{ github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: aqaqeer-version-reservations
      cancel-in-progress: false
    outputs:
      code: ${{ steps.reserve.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reserve a shared version
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/reserve-release.py

  build-debug:
    needs: reserve
    name: Build ${{ matrix.flavor }} debug APK
    if: ${{ github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        flavor: ${{ fromJSON(inputs.flavor == 'both' && '["standard","demo"]' || format('["{0}"]', inputs.flavor)) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare diagnostics
        run: mkdir -p ci-output/build

      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
        with:
          diagnostics-directory: ci-output/build

      # The selector invokes the wrapper once, reserving its normal build code.
      - name: Build selected debug APK
        id: build
        shell: bash
        env:
          CI_BUILD_FLAVOR: ${{ matrix.flavor }}
          AQAQEER_MIN_BUILD_CODE: ${{ needs.reserve.outputs.code }}
        run: |
          set -euo pipefail
          python3 tools/build_debug.py "$CI_BUILD_FLAVOR" --no-export \
            2>&1 | tee ci-output/build/gradle-build.log

      - name: Retain unsigned debug build for isolated signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-debug-${{ matrix.flavor }}-${{ github.run_id }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/
          retention-days: 1
          if-no-files-found: error

      - name: Write build summary and APK checksums
        if: ${{ !cancelled() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_COMMAND_OUTCOME: ${{ steps.build.outcome }}
          CI_BUILD_FLAVOR: ${{ matrix.flavor }}
        run: python3 .github/scripts/ci-summary.py build

      - name: Retain build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ matrix.flavor }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ci-output/build/
          if-no-files-found: error
          retention-days: 1

  sign-debug:
    needs: [reserve, build-debug]
    if: ${{ github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: debug-signing
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        flavor: ${{ fromJSON(inputs.flavor == 'both' && '["standard","demo"]' || format('["{0}"]', inputs.flavor)) }}
    steps:
      - name: Check out trusted signing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
        with:
          diagnostics-directory: ci-output/debug-signing
      - name: Download this run's selected build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_BUILD_FLAVOR: ${{ matrix.flavor }}
        run: gh run download "$GITHUB_RUN_ID" --name "unsigned-debug-$CI_BUILD_FLAVOR-$GITHUB_RUN_ID" --dir unsigned-debug
      - name: Sign selected debug APK
        env:
          CI_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_BUILD_FLAVOR: ${{ matrix.flavor }}
          CI_BUILD_CODE: ${{ needs.reserve.outputs.code }}
          AQAQEER_DEBUG_KEYSTORE_BASE64: ${{ secrets.AQAQEER_DEBUG_KEYSTORE_BASE64 }}
          AQAQEER_DEBUG_KEY_ALIAS: ${{ secrets.AQAQEER_DEBUG_KEY_ALIAS }}
          AQAQEER_DEBUG_STORE_PASSWORD: ${{ secrets.AQAQEER_DEBUG_STORE_PASSWORD }}
          AQAQEER_DEBUG_KEY_PASSWORD: ${{ secrets.AQAQEER_DEBUG_KEY_PASSWORD }}
          AQAQEER_DEBUG_CERT_SHA256: ${{ vars.AQAQEER_DEBUG_CERT_SHA256 }}
        run: python3 tools/sign_debug.py "$CI_BUILD_FLAVOR"
      - name: Retain signed debug distribution bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debug-release-${{ matrix.flavor }}-${{ github.run_id }}
          path: release-files/${{ matrix.flavor }}/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish debug APKs to GitHub Releases
    needs: sign-debug
    if: ${{ github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download this run's selected release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RELEASE_FLAVOR: ${{ inputs.flavor }}
          CI_RELEASE_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$CI_RELEASE_FLAVOR" in
            standard|demo) flavors=("$CI_RELEASE_FLAVOR") ;;
            both) flavors=(standard demo) ;;
            *) exit 1 ;;
          esac
          for flavor in "${flavors[@]}"; do
            gh run download "$CI_RELEASE_RUN" \
              --name "debug-release-$flavor-$CI_RELEASE_RUN" \
              --dir "release-files/$flavor"
            (cd "release-files/$flavor" && sha256sum --check "$flavor-SHA256SUMS.txt")
          done

      - name: Create a debug GitHub release, prerelease or draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_PUBLICATION: ${{ inputs.publication }}
          CI_RELEASE_FLAVOR: ${{ inputs.flavor }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RELEASE_RUN: ${{ github.run_id }}
          CI_RELEASE_NUMBER: ${{ github.run_number }}
          CI_RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$CI_PUBLICATION" in
            release) options=(--latest=false) ;;
            prerelease) options=(--prerelease --latest=false) ;;
            draft) options=(--draft --prerelease --latest=false) ;;
            *) exit 1 ;;
          esac
          tag="debug-$CI_RELEASE_NUMBER-$CI_RELEASE_ATTEMPT"
          {
            printf 'Debug APK distribution (%s). These are debuggable builds signed with the permanent dedicated debug key, not production-signed Android releases.\n\n' "$CI_RELEASE_FLAVOR"
            printf '<!-- aqaqeer-debug-distribution:v1 run=%s attempt=%s flavors=%s source=%s -->\n' "$CI_RELEASE_RUN" "$CI_RELEASE_ATTEMPT" "$CI_RELEASE_FLAVOR" "$CI_SOURCE_SHA"
            printf 'Source commit: %s\nTemporary build-run link: %s\n\n' "$CI_SOURCE_SHA" "$CI_RUN_URL"
            printf 'Standard: com.aqaqeer.app.debug. Demo: com.aqaqeer.app.demo.debug (fictional sample data).\n\n'
            printf 'Verified signer/package/version receipts and SHA-256 checksums are attached. Debug and production versions share android-build-N reservations. Existing installations require the same signer; never uninstall or clear pharmacy data to bypass a conflict.\n'
          } > release-notes.md
          gh release create "$tag" release-files/*/* \
            --target "$CI_SOURCE_SHA" --title "Aqaqeer debug build $CI_RELEASE_NUMBER ($CI_RELEASE_FLAVOR)" \
            --notes-file release-notes.md "${options[@]}" | tee release-url.txt
          {
            printf '### Debug GitHub Release\n\n'
            cat release-url.txt
            printf '\nMode: %s. All selected APK builds and checksum verification completed before release creation.\n' "$CI_PUBLICATION"
          } >> "$GITHUB_STEP_SUMMARY"
