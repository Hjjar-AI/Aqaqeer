name: 07 - Verify - Emulator with visual evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator:
    # Standard public-repository runners only; never select a paid larger runner.
    if: ${{ github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api: [29, 35]
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare diagnostics
        run: mkdir -p ci-output/emulator

      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
        with:
          diagnostics-directory: ci-output/emulator

      - name: Package demo application and instrumentation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --no-configuration-cache \
            -Paqaqeer.exportApks=false :app:packageDemoDebug :app:packageDemoDebugAndroidTest \
            2>&1 | tee ci-output/emulator/gradle-package.log

      - name: Enable runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run selected tests and capture visuals
        id: emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 .github/scripts/run-emulator-checks.py

      - name: Write run summary
        if: ${{ !cancelled() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_COMMAND_OUTCOME: ${{ steps.emulator.outcome }}
        run: |
          python3 .github/scripts/ci-summary.py emulator
          if [ -f ci-output/emulator/results.md ]; then
            cat ci-output/emulator/results.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain short recordings, failure screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-evidence-api${{ matrix.api }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ci-output/emulator/
          retention-days: 1
          if-no-files-found: error
