name: 04 - Checks - Android quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-workflows:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare diagnostics
        run: mkdir -p ci-output/workflows

      - name: Install verified actionlint
        run: bash .github/scripts/install-actionlint.sh

      - name: Validate all workflow files
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          actionlint -version
          actionlint -no-color 2>&1 | tee ci-output/workflows/actionlint.log

      - name: Write workflow validation summary
        if: ${{ !cancelled() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_COMMAND_OUTCOME: ${{ steps.validate.outcome }}
        run: python3 .github/scripts/ci-summary.py workflows

      - name: Retain workflow diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: ci-output/workflows/
          if-no-files-found: error
          retention-days: 1

  android-lint:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare diagnostics
        run: mkdir -p ci-output/lint

      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
        with:
          diagnostics-directory: ci-output/lint

      # No test sources, test tasks, APK packaging or version-code reservation.
      - name: Lint production sources in both debug flavors
        id: lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --no-configuration-cache --continue \
            -I .github/production-lint.init.gradle \
            :app:lintStandardDebug :app:lintDemoDebug \
            2>&1 | tee ci-output/lint/gradle-lint.log

      - name: Write Android lint summary
        if: ${{ !cancelled() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_COMMAND_OUTCOME: ${{ steps.lint.outcome }}
        run: python3 .github/scripts/ci-summary.py lint

      - name: Retain lint reports and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-lint-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ci-output/lint/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: error
          retention-days: 1
