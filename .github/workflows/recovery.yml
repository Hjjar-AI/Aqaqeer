name: 16 - Verify - Recovery boundaries

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Optional comma-separated exact scenario names listed by tools/run_restore_process_death.py scenarios(), without spaces or duplicates. Use none to omit recovery scenarios with resources=true. Default: blank = all restore, export and simulated maintenance scenarios."
        type: string
        required: false
        default: ''
      resource_methods:
        description: "Optional comma-separated exact method names measuredHistoryRoundTripsBelowBackupCap or controlledHeapPressureRejectsBeforeReplacementAndRecoversAfterRelease, without spaces or duplicates. Default: blank = both resource checks. Applies only when resources=true."
        type: string
        required: false
        default: ''
      resources:
        description: "Options: true = also run isolated history/resource-pressure checks; false = omit resource checks for a targeted recovery retry. Default: true."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery:
    if: ${{ github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
        with:
          diagnostics-directory: ci-output/recovery
      - name: Prepare selected recovery scenario arguments
        env:
          CI_RECOVERY_SCENARIOS: ${{ inputs.scenarios }}
          CI_RECOVERY_RESOURCE_METHODS: ${{ inputs.resource_methods }}
          CI_RECOVERY_RESOURCES: ${{ format('{0}', inputs.resources) }}
        run: python3 .github/scripts/prepare-recovery.py
      - name: Enable runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache downloaded system image
        uses: ./.github/actions/cache-system-image
        with:
          api-level: 35

      - name: Run owned emulator recovery campaign
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          avd-name: aqaqeer-recovery
          force-avd-creation: 'true'
          pre-emulator-launch-script: python3 .github/scripts/prepare-recovery.py --configure-avd
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: python3 .github/scripts/prepare-recovery.py --run
      - name: Retain original recovery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: recovery-boundaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/recovery/
            local/verification/runs/restore-death-*/
            app/schemas/
          retention-days: 1
          if-no-files-found: error
