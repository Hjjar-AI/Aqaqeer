name: 08 - Verify - Release output

on:
  workflow_dispatch:
    inputs:
      expected_certificate_sha256:
        description: Optional original release certificate SHA-256 (leave blank for unsigned inspection)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare diagnostics
        run: mkdir -p ci-output/release

      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
        with:
          diagnostics-directory: ci-output/release

      - name: Build shrunk standard release through the wrapper
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain --no-configuration-cache \
            -Paqaqeer.exportApks=false -Paqaqeer.releaseApkSet=distribution :app:assembleStandardRelease \
            2>&1 | tee ci-output/release/gradle-release.log

      - name: Inspect packaged release resources, native libraries and signature
        env:
          CI_RELEASE_CERT_SHA256: ${{ inputs.expected_certificate_sha256 }}
        run: python3 .github/scripts/inspect-release-set.py

      - name: Summarize release inspection status
        if: ${{ !cancelled() }}
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python3 .github/scripts/ci-summary.py release

      - name: Retain release diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ci-output/release/
            app/build/outputs/mapping/standardRelease/
          retention-days: 1
          if-no-files-found: error

      - name: Retain inspected unsigned release APK
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aqaqeer-standard-release-unsigned-verification-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/standard/release/*.apk
          retention-days: 1
          if-no-files-found: error

  startup:
    needs: release
    if: ${{ github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
        with:
          diagnostics-directory: ci-output/release-smoke
      - name: Download this run's inspected APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN_NUMBER: ${{ github.run_number }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: gh run download "$GITHUB_RUN_ID" --name "aqaqeer-standard-release-unsigned-verification-$CI_RUN_NUMBER-$CI_RUN_ATTEMPT" --dir smoke-apks
      - name: Enable runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open minified release on the owned emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          avd-name: aqaqeer-release-smoke
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 .github/scripts/run-release-smoke.py
      - name: Retain startup and cleanup evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-startup-${{ github.run_id }}
          path: ci-output/release-smoke/
          retention-days: 1
          if-no-files-found: error
