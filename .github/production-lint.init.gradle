// Keep production lint independent of the stopped test campaigns.
gradle.beforeProject { project ->
    project.pluginManager.withPlugin('com.android.application') {
        project.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
            androidDsl.lint.checkTestSources = false
            androidDsl.lint.ignoreTestSources = true
            androidDsl.lint.htmlReport = true
            androidDsl.lint.xmlReport = true
        }
    }
}
