import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Inventory resolved Maven coordinates only. No compilation, lockfile writes or upgrades.
gradle.projectsEvaluated {
    def application = gradle.rootProject.project(':app')
    application.tasks.register('ciDependencyInventory') {
        doLast {
            def runtime = application.configurations.findAll {
                it.canBeResolved && it.name.endsWith('RuntimeClasspath')
            }.sort { it.name }
            ['standardReleaseRuntimeClasspath', 'demoDebugRuntimeClasspath'].each { required ->
                if (!runtime.any { it.name == required }) throw new GradleException("Missing runtime configuration: $required")
            }
            def processors = application.configurations.findAll {
                it.canBeResolved && it.name.toLowerCase().startsWith('ksp')
            }.sort { it.name }
            if (processors.isEmpty()) throw new GradleException('No resolvable KSP configurations found')
            def scopes = []
            runtime.each { scopes.add([name: ":app:runtime:${it.name}", configuration: it]) }
            processors.each { scopes.add([name: ":app:processor:${it.name}", configuration: it]) }
            gradle.rootProject.allprojects.sort { it.path }.each { project ->
                project.buildscript.configurations.findAll {
                    it.canBeResolved && it.name == 'classpath'
                }.each { configuration ->
                    scopes.add([name: "${project.path}:buildscript:${configuration.name}", configuration: configuration])
                }
            }
            if (!scopes.any { it.name.contains(':buildscript:') }) {
                throw new GradleException('No resolvable buildscript classpath found')
            }
            def packages = [:]
            def populated = []
            scopes.each { scope ->
                def result = scope.configuration.incoming.resolutionResult
                if (result.allDependencies.any { it instanceof UnresolvedDependencyResult }) {
                    throw new GradleException("Incomplete dependency resolution: ${scope.name}")
                }
                def modules = 0
                result.allComponents.each { component ->
                    if (component.id instanceof ModuleComponentIdentifier) {
                        modules++
                        def id = component.id
                        def key = "${id.group}:${id.module}:${id.version}".toString()
                        if (!packages.containsKey(key)) packages[key] = [name: "${id.group}:${id.module}".toString(), version: id.version, configurations: []]
                        packages[key].configurations.add(scope.name.toString())
                    }
                }
                if (modules > 0) populated.add(scope.name)
            }
            if (packages.isEmpty()) throw new GradleException('Dependency inventory is empty')
            if (!populated.any { it.contains(':processor:') } || !populated.any { it.contains(':buildscript:') }) {
                throw new GradleException('Processor/build-plugin inventory is empty; coverage is incomplete')
            }
            def destination = new File(gradle.rootProject.projectDir, 'ci-output/dependencies/inventory.json')
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                configurations: scopes.collect { it.name },
                populatedConfigurations: populated,
                packages: packages.sort().values().toList()
            ])) + '\n'
        }
    }
}
