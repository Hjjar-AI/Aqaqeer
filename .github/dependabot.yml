version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: gradle
    directory: /
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: 'com.android.application:*'
        update-types: [version-update:semver-major]
      - dependency-name: 'com.android.tools.build:gradle'
        update-types: [version-update:semver-major]
      - dependency-name: 'org.jetbrains.kotlin.plugin.*:*'
        update-types: [version-update:semver-major]
      - dependency-name: 'org.jetbrains.kotlin:kotlin-gradle-plugin'
        update-types: [version-update:semver-major]
      - dependency-name: 'com.google.devtools.ksp:*'
        update-types: [version-update:semver-major]
      - dependency-name: 'com.google.dagger.hilt.android:*'
        update-types: [version-update:semver-major]
      - dependency-name: 'com.google.dagger:hilt-*'
        update-types: [version-update:semver-major]
    groups:
      android-toolchain:
        patterns:
          - 'com.android.tools.build*'
          - 'com.android.application*'
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'
          - 'com.google.dagger*'
      androidx:
        patterns:
          - 'androidx.*'
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
