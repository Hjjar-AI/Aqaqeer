version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: gradle
    directory: /
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      android-toolchain:
        patterns:
          - 'com.android.tools.build*'
          - 'com.android.application*'
          - 'org.jetbrains.kotlin*'
          - 'com.google.devtools.ksp*'
          - 'com.google.dagger*'
      androidx:
        patterns:
          - 'androidx.*'
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
